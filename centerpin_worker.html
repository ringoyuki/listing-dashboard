<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'">
<title>センターピン｜スタッフ1人用JSON作業</title>
<style>body{background:#111827;color:#f1f5f9;font:16px/1.6 system-ui;margin:0}main{max-width:980px;margin:auto;padding:20px}header,article{background:#1e293b;padding:18px;border-radius:12px;margin:12px 0}button{border:1px solid #447b91;border-radius:8px;background:#155e75;color:white;padding:9px 14px;margin:4px;cursor:pointer;font:inherit}button:disabled{opacity:.45}a{color:#8bdcff}small,.muted{color:#b6c9d4}.warning{color:#ffd98b}.card{border-top:1px solid #43505f;padding:12px 0}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.price{font-size:1.15em;font-weight:700}.label{border-radius:4px;padding:3px 7px;background:#334155}input[type=file]{max-width:280px}h1{font-size:1.4em}h2{font-size:1.15em}</style></head>
<body><main><header><h1>センターピン｜スタッフ1人用</h1><p>オーナー確定JSONを読み込み、実作業を記録して結果JSONを返します。GAS・API・自動課金は使用しません。</p>
<div class="row"><label>① 指示JSONを選択 <input id="pick" type="file" accept=".json,application/json"></label><button id="export">② 結果JSONを保存</button></div>
<p id="msg" role="status" class="warning"></p><p id="count" class="muted"></p>
<div class="row"><button data-filter="open">未完了</button><button data-filter="done">完了・売却・未落札</button><button data-filter="all">全件</button></div>
</header><section id="jobs"></section><footer class="muted">結果JSONを保存し、オーナーへ送ってください。GitHubには商品データを送信しません。この画面の作業結果は端末内保存です。</footer></main>
<script src="centerpin_core.js"></script><script src="centerpin_worker.js"></script></body></html>
